<!doctype html>
<html lang="en">
  <head>
    <!-- <meta charset="UTF-8" /> -->
    <!-- <link rel="icon" type="image/svg+xml" href="/logo.svg" /> -->
    <!-- <link rel="icon" href="/logo_icon.svg" type="image/svg+xml" sizes="any" /> -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0ea5e9" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Apply the saved or system theme before first paint, so prerendered
         pages do not flash light for dark-mode visitors. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <!-- Title, description, canonical and the og/twitter url tags below are the
         home page's; scripts/prerender.mjs swaps them per route from src/lib/pageMeta.ts. -->
    <link rel="canonical" href="https://krainode.krissemmy.com/" />
    <title>KraiNode - The Postman for blockchain RPCs</title>
    <meta name="description" content="Test and debug blockchain JSON-RPC calls in your browser. KraiNode helps developers explore, compare, and measure latency across multiple providers — no backend or API key storage." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://krainode.krissemmy.com/" />
    <meta property="og:title" content="KraiNode - The Postman for blockchain RPCs" />
    <meta property="og:description" content="Test and debug blockchain JSON-RPC calls in your browser. KraiNode helps developers explore, compare, and measure latency across multiple providers — no backend or API key storage." />
    <meta property="og:site_name" content="KraiNode" />
    <!-- Social scrapers need an absolute image URL. -->
    <meta property="og:image" content="https://krainode.krissemmy.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:site" content="@krainode_web3" />
    <meta property="twitter:url" content="https://krainode.krissemmy.com/" />
    <meta property="twitter:title" content="KraiNode - The Postman for blockchain RPCs" />
    <meta property="twitter:description" content="Test and debug blockchain JSON-RPC calls in your browser. KraiNode helps developers explore, compare, and measure latency across multiple providers — no backend or API key storage." />
    <!-- <meta property="twitter:image" content="/og.svg" /> -->
    <meta property="twitter:image" content="https://krainode.krissemmy.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KraiNode",
        "url": "https://krainode.krissemmy.com/",
        "description": "Browser-based JSON-RPC playground for testing and debugging blockchain RPC endpoints. Requests go directly from the browser to the provider you choose, with no backend or API key storage.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://opensource.org/licenses/MIT",
        "sameAs": ["https://github.com/krissemmy/krainode-rpc-proxy", "https://x.com/krainode_web3"],
        "author": {
          "@type": "Person",
          "@id": "https://www.krissemmy.com/#person",
          "name": "Emmanuel Christopher",
          "url": "https://www.krissemmy.com"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GH0WMNWGSF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-GH0WMNWGSF');
    </script>
  </head>
  <body>
    <!-- Must stay exactly this: scripts/prerender.mjs fills it with each route's HTML at build time. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
