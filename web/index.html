    <!-- The app renders client-side. This gives crawlers and AI assistants that
         do not run JavaScript a real description instead of an empty page. -->
    <noscript>
      <h1>KraiNode: test JSON-RPC endpoints without leaving the browser</h1>
      <p>
        KraiNode is a free, open-source JSON-RPC playground for blockchain developers, like Postman for
        blockchain RPCs. Choose a network, test an endpoint, edit raw JSON-RPC, and inspect the response in
        one place. Requests travel directly from your browser to the selected RPC endpoint. KraiNode has no
        application backend that receives, stores, or relays them.
      </p>
      <ul>
        <li>Probe an endpoint for CORS and connectivity before sending a heavier request.</li>
        <li>Switch between bundled public providers or use your own HTTP endpoint.</li>
        <li>Edit single or batch JSON-RPC payloads and inspect structured responses and latency.</li>
        <li>Works with Ethereum, Arbitrum, Base, Optimism, BNB Chain, Avalanche, Linea, Scroll, and other networks.</li>
      </ul>
      <p>
        <a href="https://krainode.krissemmy.com/playground">Playground</a> ·

        <a href="https://github.com/krissemmy/krainode-rpc-proxy">Source code (MIT)</a>
      </p>
      <p>
